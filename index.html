    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimasi: alpha false karena background full
        
        // UI Elements
        const mainMenu = document.getElementById('main-menu');
        const hud = document.getElementById('hud');

        const goReasonEl = document.getElementById('go-reason');
        const pauseBtn = document.getElementById('pause-btn');
        const pauseMenu = document.getElementById('pause-menu');

        // Game State Variables
        let gameState = 'MENU'; // MENU, PLAYING, PAUSED, GAMEOVER
        let currentMode = ''; // classic, arcade, zen
        let score = 0;
        let lives = 3;
        let timeLeft = 0;
        let gameLoopId;
        let timerId;
        
        // Lists for game objects
        let fruits = [];
        let particles = [];
        let splashes = [];
        let floatingTexts = [];
        
        // Blade logic
        let isSwiping = false;
        let swipePath = []; // Stores recent mouse/touch positions
        const MAX_SWIPE_LENGTH = 15; // How long the trail is
        const MIN_SWIPE_DIST = 10; // Minimum distance to register a cut

        // Setup Canvas Size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const FRUIT_TYPES = [
            { name: 'Apple', color: '#e74c3c', innerColor: '#f1c40f', points: 10, radius: 30, chance: 30 },
            { name: 'Watermelon', color: '#2ecc71', innerColor: '#e74c3c', points: 15, radius: 45, chance: 20 },
            { name: 'Orange', color: '#e67e22', innerColor: '#f39c12', points: 10, radius: 35, chance: 25 },
            { name: 'Coconut', color: '#7f8c8d', innerColor: '#ecf0f1', points: 20, radius: 40, chance: 15 },
            { name: 'Dragonfruit', color: '#9b59b6', innerColor: '#ecf0f1', points: 50, radius: 30, chance: 5 }, // Rare
            { name: 'Bomb', color: '#333', innerColor: '#111', points: 0, radius: 35, chance: 0, isBomb: true } // Chance set dynamically
        ];

        class Fruit {
            constructor() {
                // Tentukan probabilitas munculnya bom berdasarkan mode
                let bombChance = 0;
                if (currentMode === 'classic') bombChance = 0.15; // 15% chance
                if (currentMode === 'arcade') bombChance = 0.10;  // 10% chance
                // Zen mode has 0 bomb chance

                const isBombSpawn = Math.random() < bombChance;
                
                if (isBombSpawn) {
                    this.type = FRUIT_TYPES.find(f => f.isBomb);
                } else {
                    // Weighted random for fruits
                    let rand = Math.random() * 100;
                    let cumulative = 0;
                    for (let f of FRUIT_TYPES) {
                        if (f.isBomb) continue;
                        cumulative += f.chance;
                        if (rand <= cumulative) {
                            this.type = f;
                            break;
                        }
                    }
                    if(!this.type) this.type = FRUIT_TYPES[0]; // Fallback
                }

                this.x = Math.random() * (canvas.width - 100) + 50;
                this.y = canvas.height + 50;
                this.radius = this.type.radius;
                
                // Fisika lemparan
                // Lempar ke arah tengah layar
                const targetX = canvas.width / 2 + (Math.random() * 200 - 100);
                this.vx = (targetX - this.x) / 60; // Velocity X
                
                // Kecepatan Y bervariasi tergantung mode, tapi umumnya harus cukup untuk mencapai atas layar
                const minVy = -15;
                const maxVy = -22;
                this.vy = Math.random() * (maxVy - minVy) + minVy; 
                
                this.gravity = 0.4;
                this.rotation = 0;
                this.rotationSpeed = (Math.random() - 0.5) * 0.2;
                this.isCut = false;
                
                // Untuk animasi terbelah
                this.halves = []; 
                this.fuseTimer = 0; // Untuk animasi bom
            }

            update() {
                if (this.isCut) {
                    // Update belahan buah
                    this.halves.forEach(half => {
                        half.x += half.vx;
                        half.y += half.vy;
                        half.vy += this.gravity;
                        half.rotation += half.rotationSpeed;
                    });
                    return;
                }

                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.rotation += this.rotationSpeed;

                if (this.type.isBomb) {
                    this.fuseTimer += 0.1;
                }
            }

            draw() {
                if (this.isCut) {
                    // Gambar belahan
                    this.halves.forEach(half => {
                        ctx.save();
                        ctx.translate(half.x, half.y);
                        ctx.rotate(half.rotation);
                        
                        // Gambar setengah lingkaran
                        ctx.beginPath();
                        ctx.arc(0, 0, this.radius, 0, Math.PI, false);
                        ctx.fillStyle = this.type.color;
                        ctx.fill();
                        
                        // Bagian dalam
                        ctx.beginPath();
                        ctx.arc(0, 0, this.radius - 5, 0, Math.PI, false);
                        ctx.fillStyle = this.type.innerColor;
                        ctx.fill();
                        
                        ctx.restore();
                    });
                    return;
                }

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                if (this.type.isBomb) {
                    // Gambar Bom
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#222';
                    ctx.fill();
                    
                    // Highlight bom
                    ctx.beginPath();
                    ctx.arc(-10, -10, 8, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.fill();

                    // Sumbu
                    ctx.beginPath();
                    ctx.moveTo(0, -this.radius);
                    ctx.quadraticCurveTo(20, -this.radius - 20, 30, -this.radius - 10);
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = '#8B4513';
                    ctx.stroke();

                    // Percikan sumbu
                    if (Math.sin(this.fuseTimer) > 0) {
                        ctx.beginPath();
                        ctx.arc(30, -this.radius - 10, 6, 0, Math.PI * 2);
                        ctx.fillStyle = '#ff9800';
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(30, -this.radius - 10, 3, 0, Math.PI * 2);
                        ctx.fillStyle = '#ffff00';
                        ctx.fill();
                    }

                } else {
                    // Gambar Buah (Bulat sederhana untuk kinerja, tapi dengan detail warna)
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.type.color;
                    ctx.fill();

                    // Tekstur/Detail sederhana
                    ctx.beginPath();
                    ctx.arc(-this.radius * 0.3, -this.radius * 0.3, this.radius * 0.2, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.fill();
                }

                ctx.restore();
            }

            cut(cutAngle) {
                this.isCut = true;
                
                // Buat dua belahan
                for (let i = 0; i < 2; i++) {
                    const dir = i === 0 ? 1 : -1;
                    // Sudut tolakan belahan tegak lurus dengan sudut potongan
                    const pushAngle = cutAngle + (Math.PI / 2) * dir;
                    const pushForce = 5;

                    this.halves.push({
                        x: this.x,
                        y: this.y,
                        vx: this.vx + Math.cos(pushAngle) * pushForce,
                        vy: this.vy + Math.sin(pushAngle) * pushForce,
                        rotation: this.rotation,
                        rotationSpeed: this.rotationSpeed + (dir * 0.2)
                    });
                }

                // Efek partikel
                if (!this.type.isBomb) {
                    createParticles(this.x, this.y, this.type.color);
                    createSplash(this.x, this.y, this.type.color);
                } else {
                    createExplosion(this.x, this.y);
                }
            }
        }

            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;

                ctx.fillStyle = `rgba(${hexToRgb(this.color)}, ${this.life})`;
                ctx.fill();
            }
        }

                this.decay = 0.005;
                // Splashes juga tergambar sedikit acak

                for(let i
